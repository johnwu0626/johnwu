<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asset Projection 資產推估工具</title>
<!--
  資產推估工具 v1 — 依 handoff/consensus/asset-projection-tool/decision.md
  零外部請求：全部依賴 vendor/ 本地化（見 vendor/README.md）。驗收條款：DevTools Network 0 外部請求。
  樣式值一律來自 design/tokens.json（映射為 CSS 變數，變數名 = token 路徑）。
-->
<style>
:root{
  /* color */
  --c-bg:#f8fafc; --c-surface:#ffffff; --c-surface-subtle:rgba(248,250,252,.5);
  --c-border:#f1f5f9; --c-border-strong:#e2e8f0;
  --c-text:#0f172a; --c-text-2:#475569; --c-text-muted:#94a3b8; --c-text-inv:#ffffff;
  --c-brand:#4f46e5; --c-brand-hover:#4338ca; --c-brand-subtle:#eef2ff; --c-brand-shadow:#c7d2fe;
  --c-income:#059669; --c-income-subtle:#ecfdf5; --c-expense:#e11d48; --c-expense-subtle:#fff1f2;
  --c-invest:#4f46e5; --c-invest-subtle:#eef2ff; --c-loan:#d97706; --c-loan-subtle:#fffbeb;
  --c-success:#059669; --c-success-subtle:#ecfdf5; --c-warning:#f59e0b; --c-warning-strong:#d97706; --c-warning-subtle:#fffbeb;
  --c-danger:#e11d48; --c-danger-subtle:#fff1f2; --c-info:#0284c7; --c-info-subtle:#f0f9ff;
  --c-stress-critical:#e11d48; --c-stress-critical-band:rgba(225,29,72,.22);
  --c-stress-high:#fb7185; --c-stress-high-band:rgba(251,113,133,.15);
  --c-stress-medium:#f59e0b; --c-stress-medium-subtle:#fffbeb;
  --c-stress-upcoming:#0ea5e9; --c-stress-upcoming-subtle:#f0f9ff;
  --c-table-stress:rgba(254,242,242,.6);
  --c-chart-asset:#4f46e5; --c-chart-cash:#0ea5e9; --c-chart-safety:#f59e0b;
  --c-chart-b:#059669; --c-chart-c:#9333ea; --c-chart-grid:#f1f5f9; --c-chart-axis:#94a3b8;
  --c-overlay:rgba(15,23,42,.6);
  /* typography */
  --f-base:'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-mono:ui-monospace,'Cascadia Mono','Consolas',monospace;
  /* spacing / radius / shadow / motion */
  --sp-xs:4px; --sp-sm:8px; --sp-md:12px; --sp-lg:16px; --sp-xl:24px; --sp-2xl:32px;
  --r-sm:6px; --r-md:12px; --r-lg:16px; --r-card:2rem; --r-pill:9999px;
  --sh-card:0 20px 25px -5px rgba(0,0,0,.05),0 8px 10px -6px rgba(0,0,0,.05);
  --sh-card-hover:0 25px 50px -12px rgba(0,0,0,.12);
  --sh-brand:0 10px 15px -3px rgba(199,210,254,.6);
  --sh-modal:0 25px 50px -12px rgba(0,0,0,.25);
  --m-fast:150ms; --m-base:200ms; --m-slow:300ms; --m-ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--c-bg);color:var(--c-text);font-family:var(--f-base);font-size:14px}
.mono{font-family:var(--f-mono);font-weight:900;letter-spacing:-.025em}
#root{max-width:1440px;margin:0 auto;padding:var(--sp-xl)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--c-border-strong);border-radius:var(--r-pill)}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:13px}
button:active{transform:scale(.95)}
input,select{font-family:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--c-border-strong);border-radius:var(--r-sm);background:var(--c-surface);color:var(--c-text);outline:none;transition:border-color var(--m-base) var(--m-ease)}
input:focus,select:focus{border-color:var(--c-brand)}
input.mono{font-size:14px}
input.err{border-color:var(--c-danger)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);white-space:nowrap}
.card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-card);box-shadow:var(--sh-card);transition:box-shadow var(--m-base) var(--m-ease)}
.card:hover{box-shadow:var(--sh-card-hover)}
.btn{padding:8px 16px;border-radius:var(--r-md);font-weight:700;transition:all var(--m-base) var(--m-ease)}
.btn-primary{background:var(--c-brand);color:var(--c-text-inv);box-shadow:var(--sh-brand)}
.btn-primary:hover{background:var(--c-brand-hover)}
.btn-ghost{background:transparent;color:var(--c-text-2);border:1px solid var(--c-border-strong)}
.btn-ghost:hover{background:var(--c-brand-subtle)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;background:var(--c-surface-subtle);border:1px solid var(--c-border-strong);border-radius:var(--r-md);overflow:hidden}
.seg button{padding:5px 12px;color:var(--c-text-2)}
.seg button.on{background:var(--c-brand);color:var(--c-text-inv)}
.skeleton{background:var(--c-border-strong);border-radius:var(--r-sm);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.switch{position:relative;width:36px;height:20px;border-radius:var(--r-pill);background:var(--c-border-strong);transition:background var(--m-base);flex:none}
.switch.on{background:var(--c-brand)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left var(--m-base) var(--m-ease)}
.switch.on::after{left:18px}
.modal-mask{position:fixed;inset:0;background:var(--c-overlay);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;animation:fadein var(--m-slow) var(--m-ease)}
.modal{background:var(--c-surface);border-radius:var(--r-card);box-shadow:var(--sh-modal);padding:var(--sp-2xl);max-width:560px;width:92%;animation:zoomin var(--m-slow) var(--m-ease)}
.modal.modal-scroll{max-height:85vh;overflow-y:auto}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes zoomin{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 16px;border-radius:var(--r-md);box-shadow:var(--sh-modal);font-size:13px;font-weight:500;background:var(--c-surface)}
.layout{display:grid;grid-template-columns:38% 1fr;gap:var(--sp-xl);align-items:start}
.layout.left-collapsed{grid-template-columns:44px 1fr;gap:var(--sp-lg)}
.left-rail{position:sticky;top:var(--sp-lg);display:flex;flex-direction:column;align-items:center;gap:var(--sp-md);padding:var(--sp-md) 0;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);cursor:pointer;color:var(--c-text-muted);min-height:180px;transition:all var(--m-base) var(--m-ease)}
.left-rail:hover{background:var(--c-brand-subtle);color:var(--c-brand)}
.rail-label{writing-mode:vertical-rl;font-size:12px;font-weight:700;letter-spacing:.15em}
.left-col{max-height:calc(100vh - 150px);overflow-y:auto;padding:4px;position:sticky;top:var(--sp-lg)}
.stat-strip{position:sticky;top:0;z-index:21;display:flex;align-items:center;gap:var(--sp-sm);background:var(--c-bg);padding:var(--sp-sm) 0}
.chart-wrap{margin-top:var(--sp-md)}
.chart-wrap.pinned{position:sticky;top:52px;z-index:20;background:var(--c-bg);padding-bottom:var(--sp-sm)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--c-text-muted);text-align:right;padding:var(--sp-md) var(--sp-lg)}
th:first-child{text-align:left}
td{padding:var(--sp-md) var(--sp-lg);text-align:right;border-top:1px solid var(--c-border)}
td:first-child{text-align:left}
tr.hoverable:hover td{background:var(--c-brand-subtle)}
.sticky-col{position:sticky;left:0;background:var(--c-surface);z-index:10}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:var(--r-pill);background:var(--c-border-strong);padding:0;border:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--c-brand);transition:transform var(--m-fast)}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.3)}
.evt-dot{width:10px;height:10px;border-radius:50%;position:absolute;top:8px;transform:translateX(-50%);transition:transform var(--m-fast)}
.evt-dot:hover{transform:translateX(-50%) scale(1.4)}
@media (max-width:1024px){
  .layout{grid-template-columns:1fr;display:flex;flex-direction:column}
  .layout > div:last-child{order:-1} /* 平板：結論先行——右欄（摘要+圖）先於規則清單（feedback 🟡#6） */
  .left-col{max-height:none;position:static}
  .stat-strip{position:static}
  .chart-wrap.pinned{position:static}
  .stat-row{grid-template-columns:1fr 1fr !important}
  .hide-tablet{display:none !important}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/prop-types.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/Recharts.js"></script>
<script src="engine.js"></script>
<script src="app.js?b=1785810643479"></script>
</body>
</html>
