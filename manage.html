    <!-- 1. 載入 Tailwind CSS -->

    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --indigo-600: #4f46e5;
            --emerald-500: #10b981;
            --rose-500: #f43f5e;
            --slate-50: #f8fafc;
            --glass: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
        }

        body {
            background-color: var(--slate-50);
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(244, 63, 94, 0.05) 0px, transparent 50%);
            min-height: 100vh;
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            color: #1e293b;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 2.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 30px 40px -10px rgba(79, 70, 229, 0.1);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 20px;
            border: 2px solid var(--slate-50);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .animate-fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle at center, #ffffff 0%, var(--slate-50) 100%);
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

        import React, { useState, useEffect, useMemo } from 'https://esm.sh/react@18.2.0';

        const CSV_URL = 'https://docs.google.com/spreadsheets/d/168G3AtI3lIdgIv6q75Fz9BtM_u11yC1G-cz1NTJApbo/export?format=csv&gid=0';

        const FALLBACK_DATA_CSV = `日期,組別,作者,專案,議題,回應,小時,LINK,副組別
2025-12-09,品檢,OLD_TS品檢呂孟軒,【品檢組】網頁組,"功能 #71137: 【品檢組】專案進度確認,工作事項交接",工作事項交接,2,,品檢_早班

2025-12-11,網頁組,OLD_TS網頁傅琬鈞,DARA(Joya、GDCoins),TaDaSSS_遊戲說明頁歷程需求,製作歷程前後端程式,3.1,,網頁系統_緯創
2025-12-11,網頁組,OLD_TS網頁黃汶淑,VegasFrenzy(錢進大亨),VF_大富翁聖誕節換皮,頁面建置完成,5.6,,網頁美術
2025-12-11,網頁組,OLD_TS網頁葉子羿,gametower,AI 重構提詞流程框架設計,協助 C# 重構 Golang,2.4,,網頁系統_實習生

2025-12-11,網頁組,OLD_TS網頁盧泛菲,滿貫大亨,滿貫大亨_20251231消費活動-賓果,活動頁主視覺設計,7.2,,網頁美術
2025-12-11,網頁組,OLD_TS網頁謝佩岑,gametower,[實習生研究]kapa.ai,研究替代工具,8,,網頁系統_實習生
2025-12-11,網頁組,OLD_TS網頁謝昇富,gametower,Log&伺服器監控,整理 log,6.3,,網頁系統_後端
2025-12-11,網頁組,OLD_TS網頁魏嘉男,gametower,服務不中斷改版「登入：訪客」,與Mongo原廠討論問題,6.8,,網頁系統_後端
2025-12-12,客服組,OLD_TS客服李依璇,明星3缺1,功能 #222107: 【客服組】明星3缺1值班工作事務,高V服務-值機,5,,客服_VIP
2025-12-12,客服組,OLD_TS客服曾雪妮,明星3缺1,功能 #222107: 【客服組】明星3缺1值班工作事務,例行事務,1.72,,客服_值班者
2025-12-12,客服組,OLD_TS客服黃婷鈺,明星3缺1,功能 #222107: 【客服組】明星3缺1值班工作事務,執常態明星事務,0.48,,客服_值班者
2025-12-13,客服組,OLD_TS客服蔡筑琁,明星3缺1,功能 #222107: 【客服組】明星3缺1值班工作事務,iOS總退,0.65,,客服_值班者
2025-12-14,客服組,OLD_TS客服蘇清源,共用,功能 #222103: 【客服組】專案進度確認及工作任務交接,新人教育訓練,3.5,,客服_值班者
2025-12-14,資料庫組,OLD_TS資料庫組王大明,DB維護,例行檢查,正常,4,,資料庫_維運
2025-12-14,資料庫組,OLD_TS資料庫組陳小美,DB優化,索引調整,完成,3.5,,資料庫_開發`;

        const COLORS = ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316'];

        // --- 資料處理 Hook ---
        const useTimesheetData = (csvUrl, dateRange, filters) => {
            const [rawData, setRawData] = useState([]);
            const [isDataLoading, setIsDataLoading] = useState(true);
            const [dataMsg, setDataMsg] = useState('');
            const [skippedRows, setSkippedRows] = useState([]);
            const [rawDataStats, setRawDataStats] = useState({});

            const parseCSVLine = (line) => {
                const result = [];
                let startValueIndex = 0;
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    if (line[i] === '"') inQuotes = !inQuotes;
                    else if (line[i] === ',' && !inQuotes) {
                        let val = line.substring(startValueIndex, i).trim();
                        if (val.startsWith('"') && val.endsWith('"')) val = val.substring(1, val.length - 1).replace(/""/g, '"');
                        result.push(val);
                        startValueIndex = i + 1;
                    }
                }
                let lastVal = line.substring(startValueIndex).trim();
                if (lastVal.startsWith('"') && lastVal.endsWith('"')) lastVal = lastVal.substring(1, lastVal.length - 1).replace(/""/g, '"');
                result.push(lastVal);
                return result;
            };

            const parseCSV = (csvText) => {
                const rawLines = csvText.split(/\r\n|\n|\r/);
                const mergedLines = [];
                let currentBuffer = '';
                for (let i = 0; i < rawLines.length; i++) {
                    let line = rawLines[i];
                    currentBuffer = currentBuffer ? currentBuffer + '\n' + line : line;
                    const quoteCount = (currentBuffer.match(/"/g) || []).length;
                    if (quoteCount % 2 === 0) {
                        if (currentBuffer.trim()) mergedLines.push(currentBuffer);
                        currentBuffer = '';
                    }
                }
                
                const startIndex = mergedLines.findIndex(l => l.includes('日期') && l.includes('組別'));
                if (startIndex === -1) return [];
                
                const data = [];
                const skipped = [];
                const stats = {};

                for (let i = startIndex + 1; i < mergedLines.length; i++) {
                    const row = parseCSVLine(mergedLines[i]);
                    if (row.length < 7) {
                        skipped.push({ line: i, reason: '欄位不足', content: mergedLines[i] });
                        continue;
                    }
                    const dateMatch = (row[0] || '').trim().match(/^(\d{4}[-/]\d{1,2}[-/]\d{1,2})/);
                    if (!dateMatch) {
                        skipped.push({ line: i, reason: '日期無效', content: row[0] });
                        continue;
                    }
                    const validDateStr = dateMatch[1].replace(/\//g, '-');
                    const hours = parseFloat(row[6]);
                    if (isNaN(hours)) {
                        skipped.push({ line: i, reason: '工時無效', content: row[6] });
                        continue;
                    }
                    let teamName = (row[1] || '').trim();
                    if (teamName.includes('{')) continue;

                    let authorRaw = row[2] || '';
                    let cleanAuthor = authorRaw.replace(/^OLD_TS/, '').replace(/^(品檢|網頁|客服|技術|資源整合應用|資料庫)/, '').trim();

                    if (!stats[teamName]) stats[teamName] = { count: 0, totalHours: 0, authors: new Set() };
                    stats[teamName].count += 1;
                    stats[teamName].totalHours += hours;
                    stats[teamName].authors.add(cleanAuthor);

                    data.push({
                        date: validDateStr,
                        team: teamName,
                        author: cleanAuthor,
                        project: row[3],
                        issue: row[4],
                        response: row[5],
                        hours: hours,
                        subteam: row[8] || teamName
                    });
                }
                setSkippedRows(skipped);
                setRawDataStats(stats);
                return data.sort((a, b) => new Date(a.date) - new Date(b.date));
            };

            useEffect(() => {
                const fetchData = async () => {
                    setIsDataLoading(true);
                    try {
                        const response = await fetch(csvUrl);
                        if (!response.ok) throw new Error();
                        const text = await response.text();
                        const parsed = parseCSV(text);
                        setRawData(parsed);
                        setDataMsg('已成功連線至即時數據');
                    } catch (e) {
                        const parsed = parseCSV(FALLBACK_DATA_CSV);
                        setRawData(parsed);
                        setDataMsg('顯示備份數據');
                    } finally {
                        setIsDataLoading(false);
                    }
                };
                fetchData();
            }, [csvUrl]);

            const finalData = useMemo(() => {
                if (rawData.length === 0) return { filteredData: [], uniqueTeams: [], uniqueProjects: [] };
                
                // --- 1. 偵測數據中的最新日期 ---
                const rawDates = rawData.map(d => new Date(d.date)).filter(d => !isNaN(d.getTime()));
                const maxRawDate = rawDates.length > 0 ? new Date(Math.max(...rawDates)) : new Date();
                
                let data = rawData;
                const today = new Date();
                
                if (filters.isCustomDate && filters.customStartDate && filters.customEndDate) {
                    data = data.filter(d => d.date >= filters.customStartDate && d.date <= filters.customEndDate);
                } else {
                    // --- 2. 智慧偵測：判斷今日區間是否有數據 ---
                    const startDateForToday = new Date();
                    startDateForToday.setDate(today.getDate() - dateRange);
                    const startDateForTodayStr = startDateForToday.toISOString().split('T')[0];
                    
                    const hasTodayData = rawData.some(d => d.date >= startDateForTodayStr);
                    
                    if (hasTodayData) {
                        data = data.filter(d => d.date >= startDateForTodayStr);
                    } else {
                        // 智慧對齊：以數據中最大日期為基準回推
                        const alignedStartDate = new Date(maxRawDate);
                        alignedStartDate.setDate(maxRawDate.getDate() - dateRange);
                        const alignedStartDateStr = alignedStartDate.toISOString().split('T')[0];
                        data = data.filter(d => d.date >= alignedStartDateStr);
                    }
                }

                const teams = ['All', ...new Set(rawData.map(d => d.team).filter(t => t))].sort();
                const projects = ['All', ...new Set(rawData.map(d => d.project).filter(p => p))].sort();

                if (filters.selectedTeam !== 'All') data = data.filter(d => d.team === filters.selectedTeam);
                if (filters.selectedProject !== 'All') data = data.filter(d => d.project === filters.selectedProject);

                return { filteredData: data, uniqueTeams: teams, uniqueProjects: projects };
            }, [rawData, dateRange, filters]);

            return { ...finalData, isDataLoading, dataMsg, skippedRows, rawDataStats };
        };

        // --- 主元件 ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('members');
            const [dateRange, setDateRange] = useState(30);
            const [selectedTeam, setSelectedTeam] = useState('All');
            const [selectedProjectFilter, setSelectedProjectFilter] = useState('All');
            const [isCustomDate, setIsCustomDate] = useState(false);
            const [customStartDate, setCustomStartDate] = useState('');
            const [customEndDate, setCustomEndDate] = useState('');
            
            const [selectedProject, setSelectedProject] = useState(null);
            const [selectedIssue, setSelectedIssue] = useState(null);
            const [selectedMember, setSelectedMember] = useState(null);
            
            const [showAiPanel, setShowAiPanel] = useState(false);
            const [aiPrompt, setAiPrompt] = useState('');
            const [aiResponse, setAiResponse] = useState('');
            const [isAiLoading, setIsAiLoading] = useState(false);
            const [showDebug, setShowDebug] = useState(false);

            const { 
                filteredData, uniqueTeams, uniqueProjects, 
                isDataLoading, dataMsg, skippedRows, rawDataStats 
            } = useTimesheetData(CSV_URL, dateRange, {
                selectedTeam, 
                selectedProject: selectedProjectFilter,
                isCustomDate, 
                customStartDate, 
                customEndDate
            });

            // --- AI 分析處理 ---
            const handleAiAnalysis = async (customPrompt, type = 'chat') => {
                setIsAiLoading(true);
                const query = customPrompt || aiPrompt;
                if (!query && type === 'chat') { setIsAiLoading(false); return; }

                let context = "";
                if (type === 'report') {
                    context = JSON.stringify({
                        team: selectedTeam,
                        totalHours: filteredData.reduce((acc, cur) => acc + cur.hours, 0).toFixed(1),
                        topProjects: projectStats.slice(0, 5)
                    });
                } else {
                    context = JSON.stringify(filteredData.slice(0, 20));
                }

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=`, {
                        method: 'POST',
                        body: JSON.stringify({ contents: [{ parts: [{ text: `數據上下文：${context}\n問題：${query}` }] }] })
                    });
                    const res = await response.json();
                    setAiResponse(res.candidates?.[0]?.content?.parts?.[0]?.text || "分析失敗");
                } catch {
                    setAiResponse("連線失敗");
                } finally {
                    setIsAiLoading(false);
                }
            };

            const actualDays = useMemo(() => {
                if (isCustomDate && customStartDate && customEndDate) {
                    const diffTime = Math.abs(new Date(customEndDate) - new Date(customStartDate));
                    return Math.max(1, Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1);
                }
                return dateRange;
            }, [isCustomDate, customStartDate, customEndDate, dateRange]);

            const memberStats = useMemo(() => {
                const stats = {};
                filteredData.forEach(d => {
                    if (!stats[d.author]) stats[d.author] = { name: d.author, team: d.subteam, totalHours: 0, projects: new Set(), tasksCount: 0 };
                    stats[d.author].totalHours += d.hours;
                    stats[d.author].projects.add(d.project);
                    stats[d.author].tasksCount += 1;
                });
                
                const overloadLimit = (50 / 7) * actualDays;
                const underloadLimit = (25 / 7) * actualDays;

                return Object.values(stats).sort((a, b) => b.totalHours - a.totalHours)
                    .map(s => {
                        let status = 'green';
                        if (s.totalHours > overloadLimit) status = 'red';
                        else if (s.totalHours < underloadLimit) status = 'yellow';
                        
                        return { 
                            ...s, 
                            projectCount: s.projects.size, 
                            avgHoursPerTask: (s.totalHours / (s.tasksCount || 1)).toFixed(1),
                            status
                        };
                    });
            }, [filteredData, actualDays]);

            const projectStats = useMemo(() => {
                const stats = {};
                filteredData.forEach(d => {
                    if (!stats[d.project]) stats[d.project] = { name: d.project, total: 0, teams: {} };
                    stats[d.project].total += d.hours;
                    stats[d.project].teams[d.team] = (stats[d.project].teams[d.team] || 0) + d.hours;
                });
                return Object.values(stats).sort((a, b) => b.total - a.total);
            }, [filteredData]);

            const trendData = useMemo(() => {
                const map = {};
                const sortedDates = [...new Set(filteredData.map(d => d.date))].sort();
                sortedDates.forEach(date => {
                    map[date] = { date: date.substr(5), fullDate: date };
                    uniqueTeams.filter(t => t !== 'All').forEach(t => map[date][t] = 0);
                });
                filteredData.forEach(d => { if (map[d.date]) map[d.date][d.team] += d.hours; });
                return Object.values(map);
            }, [filteredData, uniqueTeams]);

            const issueStats = useMemo(() => {
                const stats = {};
                filteredData.forEach(d => {
                    const key = d.issue || '未填寫';
                    if (!stats[key]) stats[key] = { name: key, total: 0, teams: {}, projects: new Set() };
                    stats[key].total += d.hours;
                    stats[key].teams[d.team] = (stats[key].teams[d.team] || 0) + d.hours;
                    stats[key].projects.add(d.project);
                });
                return Object.values(stats).sort((a, b) => b.total - a.total).slice(0, 20);
            }, [filteredData]);

            const displayDateRangeStr = useMemo(() => {
                if (filteredData.length === 0) return '目前無資料';
                const dates = filteredData.map(d => d.date).sort();
                return `${dates[0]} ~ ${dates[dates.length - 1]}`;
            }, [filteredData]);

            if (isDataLoading) return (
                <div className="loading-screen">
                    <Loader2 size={48} className="animate-spin text-indigo-600 mb-4" />
                    <p className="text-xl font-black text-slate-800 tracking-widest uppercase">Analyzing Data...</p>
                </div>
            );

            return (
                <div className="min-h-screen p-4 md:p-8 custom-scrollbar">
                    <div className="max-w-7xl mx-auto animate-fade-in">
                        
                        {/* 玻璃擬態控制面板 */}
                        <div className="glass-card p-8 mb-8">
                            <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-8">
                                <div>
                                    <h1 className="text-3xl font-black text-slate-800 flex items-center gap-3 tracking-tight">
                                        <div className="p-3 bg-indigo-600 rounded-3xl text-white shadow-xl shadow-indigo-100 rotate-3">
                                            <Sparkles size={28} />
                                        </div>

                                                        <p className="text-xs font-black text-slate-400 mb-1">{task.date} · <span className="text-indigo-500">{task.author}</span></p>
                                                        <p className="font-black text-slate-700">{task.issue}</p>
                                                    </div>
                                                </div>
                                                <div className="text-xl font-black text-slate-800">{task.hours}h</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>
                    <footer className="mt-20 py-10 border-t border-slate-200 text-center">
                        <p className="text-[10px] font-black text-slate-300 uppercase tracking-[0.5em]">Antigravity Intelligence Systems © 2026</p>
                    </footer>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
