            COMMON_METRICS.forEach((m, idx) => {

                if (m.isBonus) { bonusSum += val; } else { coreSum += val; }

            const raw = (coreSum / coreCount) + bonusSum;
            return Math.min(raw, 100);

                        va = parseFloat(calculateTotal(a.id));

                        va = Number(scores[a.id]?.[idx]) || 0;
                        vb = Number(scores[b.id]?.[idx]) || 0;
                    } else { va = a.name; vb = b.name; }
                    if (typeof va === 'string') {
                        const cmp = va.localeCompare(vb, 'zh-Hant');
                        return sortDir === 'asc' ? cmp : -cmp;

                    return sortDir === 'asc' ? va - vb : vb - va;

                    setScores({ ...scores, [empId]: { ...(scores[empId] || {}), [idx]: rawValue } });

            const verifyDirectorPassword = () => {

            const executeSync = async () => {

            const handleAddEmployee = async () => {

            const handleToggleResign = async (emp) => {

                const isResigning = emp.status !== '離職';

                    : `確定要將「${emp.name}」復職嗎？`;

            const TITLE_OPTIONS = ['員工', '處理', '專員', '資深專員', '主任', '資深主任', '副理', '資深副理', '經理', '協理', '處長'];

            const handleUpdateTitle = async (emp, newTitle) => {

            const generateMockHistory = async () => {
                if (isOffline || !userAuth) {
                    setStatus({ type: 'error', message: '離線模式無法產生資料。' });
                    return;
                }
                if (!confirm('將為所有在職員工重新產生近 12 個月的模擬評分資料。\n⚠️ 注意：近 12 個月內的所有舊有評分將會被「全數清除」並重新產生！\n確定繼續嗎？')) return;
                setIsSyncing(true);
                setStatus({ type: 'success', message: '⏳ 正在清除舊資料並產生新模擬資料...' });
                try {
                    const now = new Date();
                    const months = [];
                    for (let i = 11; i >= 0; i--) {
                        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                        months.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
                    }
                    const activeEmps = employees.filter(e => e.status !== '離職');

                    let batch = db.batch();
                    let count = 0;
                    let totalWritten = 0;
                    let totalDeleted = 0;

                    // 1. 刪除這些月份舊資料
                    for (const s of allScores) {
                        if (months.includes(s.month)) {
                            const ref = db.collection('artifacts').doc(currentAppId).collection('public').doc('data').collection('scores').doc(`${s.month}_${s.empId}`);
                            batch.delete(ref);
                            count++;
                            totalDeleted++;
                            if (count >= 400) {
                                await batch.commit();
                                batch = db.batch();
                                count = 0;
                            }
                        }
                    }

                    // 2. 寫入新資料
                    for (const month of months) {
                        for (const emp of activeEmps) {
                            const docId = `${month}_${emp.id}`;
                            const metrics = {};
                            COMMON_METRICS.forEach((m, idx) => {
                                if (m.isBonus) {
                                    metrics[idx] = Math.floor(Math.random() * 6); // 0~5
                                } else {
                                    metrics[idx] = Math.floor(Math.random() * 39) + 60; // 60~98
                                }
                            });
                            const ref = db.collection('artifacts').doc(currentAppId).collection('public').doc('data').collection('scores').doc(docId);
                            batch.set(ref, {
                                empId: emp.id, month, team: emp.team, title: emp.title || '員工', metrics,
                                comment: '', updatedAt: new Date().toISOString(), updatedBy: 'MockGenerator'
                            });
                            count++;
                            totalWritten++;
                            if (count >= 400) {
                                await batch.commit();
                                batch = db.batch();
                                count = 0;
                                setStatus({ type: 'success', message: `⏳ 已重新寫入 ${totalWritten} 筆...` });
                            }
                        }
                    }
                    if (count > 0) await batch.commit();
                    setStatus({ type: 'success', message: `✅ 模擬資料重新產生完成！已刪除 ${totalDeleted} 筆舊資料，並寫入 ${totalWritten} 筆新資料（${months[0]} ~ ${months[months.length - 1]}）` });
                } catch (err) {
                    console.error('產生模擬資料失敗:', err);
                    setStatus({ type: 'error', message: `產生失敗: ${err.message}` });
                } finally {
                    setIsSyncing(false);
                    setTimeout(() => setStatus({ type: '', message: '' }), 8000);
                }
            };

            const handleSaveScores = async () => {

                    return;
                }
                if (!userAuth || !currentUser) return;
                try {
                    const promises = currentMembers.map(emp => {
                        const empScores = scores[emp.id] || {};
                        const docId = `${selectedMonth}_${emp.id}`;
                        const ref = db.collection('artifacts').doc(currentAppId).collection('public').doc('data').collection('scores').doc(docId);
                        return ref.set({
                            empId: emp.id, month: selectedMonth, team: emp.team, title: emp.title || '員工', metrics: empScores,
                            comment: comments[emp.id] || '',
                            updatedAt: new Date().toISOString(), updatedBy: currentUser.name
                        });
                    });
                    await Promise.all(promises);
                    setStatus({ type: 'success', message: '✅ 評核數據已同步至雲端！' });
                    setTimeout(() => setStatus({ type: '', message: '' }), 3000);
                } catch (e) {
                    if (e.code === 'permission-denied') setShowRuleHelper(true);
                    setStatus({ type: 'error', message: '儲存失敗，請檢查網路連線或資料庫權限。' });
                }
            };


            // ===== Excel 下載範例檔 =====
            const downloadTemplate = () => {
                if (typeof XLSX === 'undefined') {
                    alert('Excel 函式庫尚未載入，請檢查網路連線後重新整理頁面。');
                    return;
                }
                const headers = ['工號', '姓名', '組別', ...COMMON_METRICS.map(m => m.label)];
                const rows = currentMembers.map(emp => {
                    const row = [emp.id, emp.name, emp.team];
                    COMMON_METRICS.forEach((_, idx) => {
                        row.push(scores[emp.id]?.[idx] ?? '');
                    });
                    return row;
                });
                const wsData = [headers, ...rows];
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                ws['!cols'] = [
                    { wch: 14 }, { wch: 10 }, { wch: 14 },
                    ...COMMON_METRICS.map(() => ({ wch: 12 }))
                ];
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, '績效評分');
                XLSX.writeFile(wb, `績效評分_${currentUser.team}_${selectedMonth}.xlsx`);
                setStatus({ type: 'success', message: '✅ 範例 Excel 檔案已下載！填寫完畢後請使用上傳功能匯入。' });
                setTimeout(() => setStatus({ type: '', message: '' }), 4000);
            };

            // ===== Excel 上傳解析 =====
            const handleUploadExcel = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (typeof XLSX === 'undefined') {
                    alert('Excel 函式庫尚未載入，請檢查網路連線後重新整理頁面。');
                    e.target.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        // 嘗試解析 Excel，支援加密/受保護的檔案
                        let workbook;
                        try {
                            workbook = XLSX.read(data, { type: 'array', password: '' });
                        } catch (firstErr) {
                            // 如果是加密錯誤，給予明確提示
                            if (firstErr.message && (firstErr.message.includes('Encrypted') || firstErr.message.includes('ECMA-376'))) {
                                setStatus({ type: 'error', message: 'Excel 檔案已加密或受密碼保護。請在 Excel 中開啟此檔案，選擇「另存新檔」→ 格式選「Excel 活頁簿 (.xlsx)」→ 工具→一般選項→清除密碼→儲存，再重新上傳。' });
                                e.target.value = '';
                                return;
                            }
                            throw firstErr; // 其他錯誤繼續拋出
                        }
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                        if (rows.length < 2) {
                            setStatus({ type: 'error', message: 'Excel 檔案內容為空或格式不正確。' });
                            e.target.value = '';
                            return;
                        }
                        const newScores = { ...scores };
                        let importCount = 0;
                        let skipCount = 0;
                        for (let i = 1; i < rows.length; i++) {
                            const row = rows[i];
                            const empId = String(row[0] || '').trim();
                            if (!empId) continue;
                            const emp = currentMembers.find(m => m.id === empId);
                            if (!emp) { skipCount++; continue; }
                            const empScores = {};
                            COMMON_METRICS.forEach((_, idx) => {
                                const val = Number(row[3 + idx]);
                                if (!isNaN(val) && val >= 0 && val <= COMMON_METRICS[idx].max) {
                                    empScores[idx] = val;
                                }
                            });
                            if (Object.keys(empScores).length > 0) {
                                newScores[empId] = { ...(newScores[empId] || {}), ...empScores };
                                importCount++;
                            }
                        }
                        setScores(newScores);
                        let msg = `✅ 已匯入 ${importCount} 筆評分資料！`;
                        if (skipCount > 0) msg += ` (${skipCount} 筆工號不在名單中已略過)`;
                        msg += ' 請確認後按「儲存並同步雲端」。';
                        setStatus({ type: 'success', message: msg });
                    } catch (err) {
                        console.error('Excel 解析失敗:', err);
                        setStatus({ type: 'error', message: 'Excel 解析失敗：' + err.message });
                    }
                    e.target.value = '';
                };
                reader.readAsArrayBuffer(file);
            };

            const calculateTotal = (empId) => {
                const empScores = scores[empId] || {};
                return calcAvg(empScores).toFixed(2);
            };

            const analyticsData = useMemo(() => {
                const ratedMembers = employees.filter(e => rangeScores[e.id]);
                const totalRated = ratedMembers.length;

                const data = {
                    teamAvg: {},
                    metricAvg: Array(COMMON_METRICS.length).fill(0),
                    titleAvg: {},
                    distribution: { '卓越 90+': 0, '優秀 80-89': 0, '良好 70-79': 0, '待加強 <70': 0 },
                    bestTeamPerMetric: Array(COMMON_METRICS.length).fill({ team: '-', score: 0 })
                };

                const teamMetricSums = {};
                TEAMS.forEach(t => {
                    const teamMembers = ratedMembers.filter(e => e.team === t);
                    teamMetricSums[t] = Array(COMMON_METRICS.length).fill(0);

                    if (teamMembers.length === 0) {
                        data.teamAvg[t] = "0.0";
                    } else {
                        let totalSum = 0;
                        teamMembers.forEach(emp => {
                            const empScores = rangeScores[emp.id];
                            COMMON_METRICS.forEach((_, idx) => {
                                const s = Number(empScores[idx]) || 0;
                                teamMetricSums[t][idx] += s;
                            });
                            totalSum += calcAvg(empScores);
                        });
                        data.teamAvg[t] = (totalSum / teamMembers.length).toFixed(1);
                    }
                });

                if (totalRated > 0) {
                    COMMON_METRICS.forEach((_, idx) => {
                        let metricTotal = 0;
                        let bestTeam = '-';
                        let bestTeamScore = -1;

                        TEAMS.forEach(t => {
                            const teamMembers = ratedMembers.filter(e => e.team === t);
                            if (teamMembers.length > 0) {
                                const avg = teamMetricSums[t][idx] / teamMembers.length;
                                metricTotal += teamMetricSums[t][idx];
                                if (avg > bestTeamScore) {
                                    bestTeamScore = avg;
                                    bestTeam = t;
                                }
                            }
                        });
                        data.metricAvg[idx] = (metricTotal / totalRated).toFixed(1);
                        data.bestTeamPerMetric[idx] = { team: bestTeam, score: bestTeamScore.toFixed(1) };
                    });
                } else {
                    data.metricAvg = data.metricAvg.map(() => "0.0");
                }

                const TITLE_HIERARCHY = ['員工', '處理', '專員', '資深專員', '主任', '資深主任', '副理', '資深副理', '經理', '協理', '處長'];
                data.TITLE_HIERARCHY = TITLE_HIERARCHY;
                data.titleMetricsAvg = {};

                TITLE_HIERARCHY.forEach(title => {
                    const titleMembers = ratedMembers.filter(e => getEffectiveTitle(e) === title);
                    if (titleMembers.length === 0) {
                        data.titleAvg[title] = "0.0";
                        data.titleMetricsAvg[title] = Array(COMMON_METRICS.length).fill(0);
                    } else {
                        let totalAvgSum = 0;
                        const metricsSum = Array(COMMON_METRICS.length).fill(0);

                        titleMembers.forEach(emp => {
                            const scores = rangeScores[emp.id];
                            totalAvgSum += calcAvg(scores);
                            COMMON_METRICS.forEach((_, idx) => {
                                metricsSum[idx] += Number(scores[idx]) || 0;
                            });
                        });

                        data.titleAvg[title] = (totalAvgSum / titleMembers.length).toFixed(1);
                        data.titleMetricsAvg[title] = metricsSum.map(sum => Math.round((sum / titleMembers.length) * 10) / 10);
                    }
                });

                ratedMembers.forEach(emp => {
                    const s = rangeScores[emp.id];
                    const avg = calcAvg(s);
                    if (avg >= 90) data.distribution['卓越 90+']++;
                    else if (avg >= 80) data.distribution['優秀 80-89']++;
                    else if (avg >= 70) data.distribution['良好 70-79']++;
                    else data.distribution['待加強 <70']++;
                });



                // 上期比較：取區間起始月的前一個月
                const [sy, sm] = analyzeStart.split('-').map(Number);
                const prevD = new Date(sy, sm - 2, 1);
                const prevMonthStr = `${prevD.getFullYear()}-${String(prevD.getMonth() + 1).padStart(2, '0')}`;
                const prevScoresMap = {};
                allScores.filter(s => s.month === prevMonthStr).forEach(s => { prevScoresMap[s.empId] = s.metrics; });

                data.prevTeamAvg = {};
                TEAMS.forEach(t => {
                    const prevTeamMembers = employees.filter(e => e.team === t && prevScoresMap[e.id]);
                    if (prevTeamMembers.length === 0) {
                        data.prevTeamAvg[t] = null;
                    } else {
                        let prevSum = 0;
                        prevTeamMembers.forEach(emp => {
                            prevSum += calcAvg(prevScoresMap[emp.id]);
                        });
                        data.prevTeamAvg[t] = (prevSum / prevTeamMembers.length).toFixed(1);
                    }
                });

                // 個人排名（基於區間平均）
                data.ranking = ratedMembers.map(emp => {
                    const s = rangeScores[emp.id];
                    const avg = calcAvg(s);
                    const prevS = prevScoresMap[emp.id];
                    let prevAvg = null;
                    if (prevS) {
                        prevAvg = calcAvg(prevS);
                    }
                    return { id: emp.id, name: emp.name, team: emp.team, avg: Math.round(avg * 10) / 10, prevAvg: prevAvg !== null ? Math.round(prevAvg * 10) / 10 : null };
                }).sort((a, b) => b.avg - a.avg);

                data.alerts = [];
                data.ranking.forEach(emp => {
                    const s = rangeScores[emp.id];
                    const prevS = prevScoresMap[emp.id];
                    if (!s || !prevS) return;

                    // 總分下降或暴增
                    if (emp.prevAvg !== null && emp.prevAvg > 0) {
                        const diff = emp.avg - emp.prevAvg;
                        const changePct = (diff / emp.prevAvg) * 100;
                        if (Math.abs(changePct) >= 10) {
                            data.alerts.push({
                                id: emp.id, name: emp.name, team: emp.team,
                                type: changePct > 0 ? 'surge' : 'drop',
                                metric: '整體平均',
                                value: `${changePct > 0 ? '+' : ''}${changePct.toFixed(1)}%`,
                                desc: `從 ${emp.prevAvg} 變為 ${emp.avg}`,
                                action: changePct > 0 ? '👉 建議：給予即時肯定，確認是否承擔高難度任務並列入晉升考量。' : '👉 建議：安排面談，了解近期是否有專案瓶頸或個人因素影響。'
                            });
                        }
                    }

                    // 單項指標下降或暴增（排除加分項，因為分母太小會導致 % 數劇烈波動）
                    COMMON_METRICS.forEach((m, idx) => {
                        if (m.isBonus) return;
                        const currV = Number(s[idx]) || 0;
                        const prevV = Number(prevS[idx]) || 0;
                        if (prevV > 0) {
                            const mDiff = currV - prevV;
                            const mChangePct = (mDiff / prevV) * 100;
                            if (Math.abs(mChangePct) >= 10) {
                                data.alerts.push({
                                    id: emp.id, name: emp.name, team: emp.team,
                                    type: mChangePct > 0 ? 'surge' : 'drop',
                                    metric: m.label,
                                    value: `${mChangePct > 0 ? '+' : ''}${mChangePct.toFixed(1)}%`,
                                    desc: `從 ${prevV} 變為 ${currV}`,
                                    action: mChangePct > 0 ? '👉 建議：表揚其專項上的突破，可請其向團隊分享經驗。' : '👉 建議：針對此指標提供具體反饋，必要時安排相關輔導培訓。'
                                });
                            }
                        }
                    });

                    // 同期核心指標極端落差分析 (Anomaly Detection)
                    // 找出該員工在「核心指標」中的最高分與最低分
                    let maxCore = -1;
                    let minCore = 101;
                    let maxMetric = '';
                    let minMetric = '';
                    COMMON_METRICS.forEach((m, idx) => {
                        if (m.isBonus) return;
                        const v = Number(s[idx]) || 0;
                        if (v > maxCore) { maxCore = v; maxMetric = m.label; }
                        if (v < minCore) { minCore = v; minMetric = m.label; }
                    });

                    // 如果最高與最低相差 >= 20 分，視為極端落差（偏科）
                    if (maxCore !== -1 && minCore !== 101 && (maxCore - minCore) >= 20) {
                        data.alerts.push({
                            id: emp.id, name: emp.name, team: emp.team,
                            type: 'gap',
                            metric: '指標極端落差',
                            value: `${maxCore - minCore}分`,
                            desc: `最高[${maxMetric}] ${maxCore}分 vs 最低[${minMetric}] ${minCore}分`,
                            action: `👉 建議：發揮${maxMetric}專長並輔導${minMetric}短板，避免偏科成為團隊衝突未爆彈。`
                        });
                    }

                    // 關鍵人才離職風險預測 (Flight Risk Index)
                    // 找出九宮格中落在「未來領袖」或「可靠骨幹」的員工 (Core >= 75)
                    let coreSum = 0, coreCount = 0, bonusSum = 0;
                    COMMON_METRICS.forEach((m, idx) => {
                        const val = Number(s[idx]) || 0;
                        if (m.isBonus) bonusSum += val;
                        else { coreSum += val; coreCount++; }
                    });
                    const coreAvg = coreCount > 0 ? (coreSum / coreCount) : 0;

                    if (coreAvg >= 75) {
                        // 取得該員工近三個月的總平均分數
                        const [sy, sm] = analyzeStart.split('-').map(Number);
                        const m1D = new Date(sy, sm - 1, 1); // 本期
                        const m2D = new Date(sy, sm - 2, 1); // 上期
                        const m3D = new Date(sy, sm - 3, 1); // 上上期
                        const getMonthStr = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;

                        const m1Str = getMonthStr(m1D);
                        const m2Str = getMonthStr(m2D);
                        const m3Str = getMonthStr(m3D);

                        const m1Score = allScores.find(score => score.empId === emp.id && score.month === m1Str);
                        const m2Score = allScores.find(score => score.empId === emp.id && score.month === m2Str);
                        const m3Score = allScores.find(score => score.empId === emp.id && score.month === m3Str);

                        if (m1Score && m2Score && m3Score) {
                            const avg1 = calcAvg(m1Score.metrics);
                            const avg2 = calcAvg(m2Score.metrics);
                            const avg3 = calcAvg(m3Score.metrics);

                            // 條件1: 連續三個月下滑 & 總跌幅超過 3 分
                            const isDeclining = (avg3 > avg2) && (avg2 > avg1) && ((avg3 - avg1) >= 3);

                            // 條件2: 核心指標中有任一項掛零或極低 (< 40) 代表情緒性怠工
                            let hasCriticalLowCore = false;
                            COMMON_METRICS.forEach((m, idx) => {
                                if (!m.isBonus && Number(m1Score.metrics[idx] || 0) < 40) {
                                    hasCriticalLowCore = true;
                                }
                            });

                            if (isDeclining || hasCriticalLowCore) {
                                let desc = `績效連續三個月下滑 (${avg3.toFixed(1)} ➔ ${avg2.toFixed(1)} ➔ ${avg1.toFixed(1)})`;
                                if (hasCriticalLowCore) desc += `，且部分核心指標出現罕見低分！`;

                                data.alerts.push({
                                    id: emp.id, name: emp.name, team: emp.team,
                                    type: 'flight_risk',
                                    metric: '離職高風險',
                                    value: '警報',
                                    desc: desc,
                                    action: '🚨 建議：立刻主動關心，釐清是否遭遇不公對待或職涯倦怠，及時介入慰留！'
                                });
                            }
                        }
                    }

                    // 黑馬崛起探測器 (Hidden Gem Detector)
                    // 鎖定職等為「員工」或「主任」的基層員工，且本期總分介於 70~82 (不在領袖區，但有進步空間)
                    if ((emp.title === '員工' || emp.title === '主任') && emp.avg >= 70 && emp.avg <= 82) {
                        const [sy, sm] = analyzeStart.split('-').map(Number);
                        const m1D = new Date(sy, sm - 1, 1); // 本期 (-0m)
                        const m2D = new Date(sy, sm - 2, 1); // 上期 (-1m)
                        const m3D = new Date(sy, sm - 3, 1); // 上上期 (-2m)
                        const m4D = new Date(sy, sm - 4, 1); // 上上上期 (-3m)
                        const getMonthStr = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;

                        const m1Str = getMonthStr(m1D);
                        const m2Str = getMonthStr(m2D);
                        const m3Str = getMonthStr(m3D);
                        const m4Str = getMonthStr(m4D);

                        const m1Score = allScores.find(score => score.empId === emp.id && score.month === m1Str);
                        const m2Score = allScores.find(score => score.empId === emp.id && score.month === m2Str);
                        const m3Score = allScores.find(score => score.empId === emp.id && score.month === m3Str);
                        const m4Score = allScores.find(score => score.empId === emp.id && score.month === m4Str);

                        if (m1Score && m2Score && m3Score && m4Score) {
                            const avg1 = calcAvg(m1Score.metrics);
                            const avg2 = calcAvg(m2Score.metrics);
                            const avg3 = calcAvg(m3Score.metrics);
                            const avg4 = calcAvg(m4Score.metrics);

                            // 條件：連續三期都在成長 (avg1 > avg2 > avg3 > avg4)，且總成長幅度大於 3 分
                            if ((avg1 > avg2) && (avg2 > avg3) && (avg3 > avg4) && ((avg1 - avg4) >= 3)) {
                                data.alerts.push({
                                    id: emp.id, name: emp.name, team: emp.team,
                                    type: 'hidden_gem',
                                    metric: '潛力黑馬',
                                    value: `升幅`,
                                    desc: `連續四個月穩定成長 (從 ${avg4.toFixed(1)} ➔ ${avg1.toFixed(1)})`,
                                    action: '🌟 建議：安排會談給予鼓勵表揚，或指派進階任務以驗證潛力，加速梯隊發展。'
                                });
                            }
                        }
                    }

                });

                data.totalRated = totalRated;

                // 九宮格 / 散佈圖資料準備
                data.scatterData = ratedMembers.map(emp => {
                    const s = rangeScores[emp.id];
                    let coreSum = 0, coreCount = 0, bonusSum = 0;
                    COMMON_METRICS.forEach((m, idx) => {
                        const val = Number(s[idx]) || 0;
                        if (m.isBonus) bonusSum += val;
                        else { coreSum += val; coreCount++; }
                    });
                    return {
                        id: emp.id,
                        name: emp.name,
                        team: emp.team,
                        coreAvg: coreCount > 0 ? Math.round((coreSum / coreCount) * 10) / 10 : 0,
                        bonusSum: Math.round(bonusSum * 10) / 10,
                        ...s
                    };
                });

                return data;
            }, [rangeScores, employees, allScores, analyzeStart, getEffectiveTitle]);

            const scrollAlerts = (direction) => {
                if (alertScrollRef.current) {
                    const scrollAmount = 360; // Approximate width of one card + gap
                    alertScrollRef.current.scrollBy({ left: direction === 'left' ? -scrollAmount : scrollAmount, behavior: 'smooth' });
                }
            };

            // ===== Scatter Plot State =====
            const [scatterX, setScatterX] = useState(0); // 預設 X 軸: 專業職能 (索引 0)
            const [scatterY, setScatterY] = useState(3); // 預設 Y 軸: 溝通協作 (索引 3)
            const [scatterSelectedTeams, setScatterSelectedTeams] = useState(TEAMS);

            const handleScatterLegendClick = (e) => {
                const team = e.value;
                setScatterSelectedTeams(prev => {
                    if (prev.includes(team)) {
                        return prev.filter(t => t !== team);
                    } else {
                        return [...prev, team];
                    }
                });
            };

            // ===== Trend Charts Data Generation =====
            const last12MonthsStr = useMemo(() => {
                const res = [];
                const now = new Date();
                for (let i = 11; i >= 0; i--) {
                    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                    res.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
                }
                return res;
            }, []);

            const COLORS = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4'];

            const [selectedTeamTrend, setSelectedTeamTrend] = useState(TEAMS[0]);
            const [selectedEmpTrend, setSelectedEmpTrend] = useState('');

            // 當選擇的組別改變時，重置人員選擇
            useEffect(() => {
                const teamEmps = employees.filter(e => e.team === selectedTeamTrend);
                if (teamEmps.length > 0) {
                    setSelectedEmpTrend(teamEmps[0].id);
                } else {
                    setSelectedEmpTrend('');
                }
            }, [selectedTeamTrend, employees]);

            const teamTrendDataMap = useMemo(() => {
                if (allScores.length === 0) return {};
                const map = {}; // { teamName: [ {name:'2023-01', metric0: 85, metric1: 90...}, ... ] }

                TEAMS.forEach(t => {
                    const teamHistory = [];
                    analyzeMonths.forEach(month => {
                        const monthScores = allScores.filter(s => s.month === month && s.team === t);
                        const dataPoint = { name: month };

                        if (monthScores.length === 0) {
                            COMMON_METRICS.forEach((_, idx) => { dataPoint[`M${idx}`] = null; });
                            dataPoint.totalAvg = null;
                            teamHistory.push(dataPoint);
                            return;
                        }

                        let totalSum = 0;
                        COMMON_METRICS.forEach((_, idx) => {
                            let mSum = 0;
                            monthScores.forEach(s => { mSum += (s.metrics[idx] || 0); });
                            const avg = Math.round(mSum / monthScores.length);
                            dataPoint[`M${idx}`] = avg;
                        });
                        // 用平均後的指標計算 totalAvg
                        dataPoint.totalAvg = Math.round(calcAvg(COMMON_METRICS.reduce((obj, _, idx) => { obj[idx] = dataPoint[`M${idx}`]; return obj; }, {})));
                        teamHistory.push(dataPoint);
                    });
                    map[t] = teamHistory;
                });
                return map;
            }, [allScores, analyzeMonths]);

            const empTrendData = useMemo(() => {
                if (!selectedEmpTrend || allScores.length === 0) return [];
                const history = [];
                last12MonthsStr.forEach(month => {
                    const monthScore = allScores.find(s => s.month === month && s.empId === selectedEmpTrend);
                    const dataPoint = { name: month };

                    if (!monthScore) {
                        COMMON_METRICS.forEach((_, idx) => { dataPoint[`M${idx}`] = null; });
                        dataPoint.totalAvg = null;
                        history.push(dataPoint);
                        return;
                    }

                    COMMON_METRICS.forEach((_, idx) => {
                        const val = monthScore.metrics[idx] || 0;
                        dataPoint[`M${idx}`] = val;
                    });
                    dataPoint.totalAvg = Math.round(calcAvg(monthScore.metrics));
                    dataPoint.comment = monthScore.comment || ''; // 抓取當月評語
                    history.push(dataPoint);
                });
                console.log("📍 [個人趨勢] 當前選定人員:", selectedEmpTrend);
                console.log("📍 [個人趨勢] 產生的歷史資料陣列:", history);
                return history;
            }, [selectedEmpTrend, allScores, last12MonthsStr]);

            const CustomTooltip = ({ active, payload, label }) => {
                if (active && payload && payload.length) {
                    const dataPoint = payload[0].payload;
                    return (
                        <div className="bg-slate-900/95 text-white p-4 rounded-2xl shadow-xl font-sans text-sm border border-slate-700/50 backdrop-blur-md max-w-xs">
                            <p className="font-bold text-slate-300 mb-2 border-b border-slate-700 pb-2 flex justify-between">
                                <span>{label}</span>
                                <span className="text-emerald-400 font-mono">Avg: {dataPoint.totalAvg}</span>
                            </p>
                            <div className="grid grid-cols-2 gap-x-6 gap-y-1.5 mb-3">
                                {payload.filter(p => p.dataKey !== 'totalAvg').map((entry, index) => (
                                    <div key={index} className="flex justify-between items-center gap-4">
                                        <span className="flex items-center gap-2 text-slate-300 text-xs">
                                            <span className="w-2 h-2 rounded-full" style={{ backgroundColor: entry.color }}></span>
                                            {entry.name}
                                        </span>
                                        <span className="font-mono font-bold text-white text-right">{entry.value}</span>
                                    </div>
                                ))}
                            </div>
                            {dataPoint.comment && (
                                <div className="mt-3 pt-3 border-t border-slate-700/50">
                                    <div className="text-[10px] text-slate-400 font-bold mb-1 flex items-center gap-1">
                                        <Icon name="MessageSquare" size={12} />主管評語
                                    </div>
                                    <div className="text-xs text-indigo-200 leading-relaxed font-medium bg-slate-800/50 p-2.5 rounded-xl text-left line-clamp-4">
                                        {dataPoint.comment}
                                    </div>
                                </div>
                            )}
                        </div>
                    );
                }
                return null;
            };

            // ===== End of Trend Charts Data Generation =====

            // 登入前畫面
            if (!currentUser) {
                return (
                    <div className="min-h-screen bg-slate-100 flex items-center justify-center p-6 text-gray-800 font-sans">
                        {isAuthModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 flex items-center justify-center p-4">
                                <div className="bg-white rounded-[2.5rem] shadow-2xl p-8 max-w-sm w-full border border-indigo-50 animate-in zoom-in duration-200 text-center font-sans">
                                    <div className="p-4 bg-indigo-600 rounded-3xl mb-4 shadow-lg shadow-indigo-200 inline-block">
                                        <Icon name="KeyRound" className="text-white" />
                                    </div>
                                    <h3 className="text-xl font-black text-slate-800 mb-1">部長身分驗證</h3>
                                    <p className="text-slate-400 text-sm mb-6 font-medium">請輸入授權密碼以進入</p>
                                    <input autoFocus type="password" placeholder="請輸入密碼" className={`w-full px-5 py-4 bg-slate-50 border-2 rounded-2xl outline-none font-mono text-center tracking-widest mb-4 ${authError ? 'border-red-400 focus:border-red-500' : 'border-slate-100 focus:border-indigo-500'}`} value={passwordInput} onChange={(e) => { setPasswordInput(e.target.value); setAuthError(false); }} onKeyDown={(e) => e.key === 'Enter' && verifyDirectorPassword()} />
                                    {authError && <p className="text-red-500 text-xs font-bold mb-4 animate-bounce">密碼不正確</p>}
                                    <div className="flex gap-3 w-full font-black">
                                        <button onClick={() => setIsAuthModalOpen(false)} className="flex-1 py-4 bg-slate-100 text-slate-500 rounded-2xl hover:bg-slate-200 transition-all font-black">取消</button>
                                        <button onClick={verifyDirectorPassword} className="flex-1 py-4 bg-indigo-600 text-white rounded-2xl shadow-lg active:scale-95 transition-all font-black">登入系統</button>
                                    </div>
                                </div>
                            </div>
                        )}
                        <div className="bg-white p-8 rounded-[2.5rem] shadow-2xl border border-slate-200 w-full max-w-md text-center animate-fade-in font-sans">
                            <div className="inline-flex p-4 bg-indigo-600 rounded-3xl shadow-lg shadow-indigo-100 mb-4 font-black">
                                <Icon name="ShieldCheck" className="text-white" size={40} />
                            </div>
                            <h2 className="text-2xl font-black text-slate-800 mb-2 tracking-tight">技術服務部績效系統</h2>
                            <p className="text-slate-400 text-xs mb-8 font-black uppercase tracking-[0.2em] opacity-60">Auth Protected V4.2</p>
                            <div className="grid gap-3 overflow-y-auto max-h-[450px] pr-2 custom-scrollbar text-left font-sans">
                                {LEAD_PERMISSIONS.map((lead) => (
                                    <button key={lead.name} onClick={() => lead.isDirector ? setIsAuthModalOpen(true) : setCurrentUser(lead)} className={`w-full flex items-center justify-between p-4 rounded-2xl border-2 transition-all group ${lead.isDirector ? 'border-indigo-100 bg-indigo-50/5' : 'border-slate-50'} hover:border-indigo-500 hover:bg-indigo-50 active:scale-[0.98]`}>
                                        <div>
                                            <div className="flex items-center gap-2">
                                                <span className={`font-bold ${lead.isDirector ? 'text-indigo-700' : 'text-slate-700'}`}>{lead.name}</span>
                                                <span className={`text-[10px] px-2 py-0.5 rounded-full font-black uppercase ${lead.isDirector ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-400'}`}>{lead.role}</span>
                                            </div>
                                            <div className="text-xs text-slate-400 font-bold uppercase tracking-wider">{lead.team}</div>
                                        </div>
                                        {lead.isDirector ? <Icon name="Lock" className="text-indigo-400" size={16} /> : <Icon name="ChevronDown" className="text-slate-300 -rotate-90 group-hover:text-indigo-500 transition-transform" size={16} />}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            // 系統主畫面
            return (
                <div className="min-h-screen bg-slate-50 p-4 md:p-8 font-sans text-gray-800 relative font-sans">
                    {/* Firebase 規則修復小幫手 Modal */}
                    {showRuleHelper && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[60] flex items-center justify-center p-6 text-center font-sans font-black">
                            <div className="bg-white rounded-[2.5rem] shadow-2xl p-8 max-w-lg w-full border-4 border-red-50 animate-in zoom-in duration-200">
                                <div className="p-4 bg-red-100 rounded-full inline-block mb-4"><Icon name="AlertTriangle" className="text-red-600" size={40} /></div>
                                <h3 className="text-2xl font-black text-slate-800 mb-2">Firebase 權限被拒絕</h3>
                                <p className="text-slate-600 mb-6 font-medium text-sm leading-relaxed px-4 text-left bg-slate-50 p-4 rounded-xl">
                                    系統偵測到您的資料庫處於鎖定狀態。請前往 Firebase Console 的 <b>Firestore Database &gt; 規則 (Rules)</b>，並將內容完全替換為以下程式碼：
                                </p>
                                <div className="bg-slate-900 text-emerald-400 p-5 rounded-2xl text-left font-mono text-[11px] leading-relaxed overflow-x-auto mb-6 shadow-inner">
                                    <pre>{`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    // 【終極測試版規則】: 允許任何連線讀寫，用於排除錯誤
    match /{document=**} {
      allow read, write: if true;
    }
  }
}`}</pre>
                                </div>
                                <div className="flex gap-4">
                                    <button onClick={() => setShowRuleHelper(false)} className="flex-1 py-4 bg-slate-100 text-slate-600 rounded-2xl transition-all hover:bg-slate-200 font-black">我已發佈，關閉提示</button>
                                </div>
                            </div>
                        </div>
                    )}
